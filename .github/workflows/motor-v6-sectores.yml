name: Motor City 6 · sectores en navegador
on:
  pull_request:
    paths:
      - 'motor-v6/src/**'
      - 'motor-v6/tests/**'
      - '.github/workflows/motor-v6-sectores.yml'
  push:
    paths:
      - 'motor-v6/src/**'
      - 'motor-v6/tests/**'
      - '.github/workflows/motor-v6-sectores.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de componentes
        run: |
          node motor-v6/tests/verificar.mjs
          node motor-v6/tests/bucle.mjs
          node motor-v6/tests/fisica.mjs
          node motor-v6/tests/sectores.mjs
          node motor-v6/tests/relevo-sectores.mjs
          node motor-v6/tests/red-ciclo.mjs
          node motor-v6/tests/mundo-sectores.mjs
      - name: Instalar Playwright fuera del repositorio
        run: npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.56.1
      - name: Usar Chromium o Chrome del runner
        shell: bash
        run: |
          browser_path="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$browser_path" ]; then
            echo "No se encontró un navegador Chromium en el runner" >&2
            exit 1
          fi
          "$browser_path" --version
          echo "MC_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
      - name: Recorrido continuo y trabajador real
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node motor-v6/tests/sectores-navegador.mjs
      - name: RCS1 y respaldo JSON con Worker real (CPU 4x)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node motor-v6/tests/rcs1-navegador.mjs
      - name: Escena WebGL y movimiento real por teclado (datos sintéticos)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node motor-v6/tests/mundo-sectores-navegador.mjs
