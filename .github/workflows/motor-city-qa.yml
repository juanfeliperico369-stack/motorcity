name: Motor City · compilación y calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motor-city-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Núcleo, atlas y construcción
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construir HTML y el motor
        run: node motor.mjs construir
      - name: C-M34 · carga única y presupuesto LRU de MC.Planeta
        run: node pruebas/planeta-cache-cm34.mjs
      - name: Pruebas Node
        run: node motor.mjs prueba
      - name: G-H21/22/23 · lugares, paradas y lenguaje
        run: node pruebas/getaway-contenido.mjs
      - name: Revisar arte Gemini
        run: node motor.mjs revisar-arte arte/gemini
      - name: Revisar arte ChatGPT
        run: node motor.mjs revisar-arte arte/chatgpt
      - name: Metadatos de construcción
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-city-construccion
          path: dist/construccion.json
          if-no-files-found: ignore
          retention-days: 7

  navegador:
    name: Chromium móvil y público simulado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: nucleo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright en el runner
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Construir HTML offline
        run: node motor.mjs construir
      - name: QA en Chromium
        run: node motor.mjs prueba --navegador
      - name: TURNO CERO · vertical slice offline en 4 tamaños
        run: node pruebas/getaway-prototipo.mjs
      - name: TURNO CERO 3D · WebGL2, cuatro formatos y misión completa
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          xvfb-run -a node pruebas/getaway-3d.mjs
      - name: C-M25 · Portada móvil y escritorio (anti plantilla genérica)
        run: node pruebas/portada.mjs
      - name: G-H1 · 14 capturas de revisión
        run: node motor.mjs capturas
      - name: Público simulado (ventana completa)
        run: node motor.mjs publico --seg 45
      - name: Guardar métricas de QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-city-publico
          path: |
            dist/publico.md
            dist/publico.json
            dist/capturas/
            dist/getaway-3d/
            dist/construccion.json
          if-no-files-found: ignore
          retention-days: 7
