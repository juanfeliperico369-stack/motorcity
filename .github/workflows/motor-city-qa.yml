name: Motor City · compilación y calidad

on:
  pull_request:
    branches: [main]
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motor-city-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Núcleo, atlas y construcción
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Construir HTML y el motor
        run: node motor.mjs construir
      - name: C-M34 · regresión de caché de sectores
        run: node pruebas/sectores-cm34.mjs
      - name: C-M34 · geometría y LRU de sectores raster
        run: node pruebas/raster-sector-cm34.mjs
      - name: C-M34 · integridad MC4 original y reconstrucción raster por regiones
        run: node pruebas/paquete-capas-cm34.mjs
      - name: C-M34 · Planeta sin cargas duplicadas ni resurrección
        run: node pruebas/planeta-cache-cm34.mjs
      - name: Pruebas Node
        run: node motor.mjs prueba
      - name: "Ningún comentario de línea se traga código"
        run: node pruebas/comentarios-tragados.mjs
      - name: 5.3.1 · skills iguales en .claude/skills y .agents/skills, .gitignore y catálogo fijado
        run: node motor.mjs skills --verificar
      - name: G-H21/22/23 · lugares, paradas y lenguaje
        run: node pruebas/getaway-contenido.mjs
      - name: 4.5 · PVS horneado sin fugas (Guatapé y Manhattan)
        run: node pruebas/pvs.mjs
      - name: 5.3.2 · calles libres (ninguna huella sobre el asfalto en los tres mundos saneados)
        run: node pruebas/calles-libres.mjs
      - name: Revisar arte Gemini
        run: node motor.mjs revisar-arte arte/gemini
      - name: Revisar arte ChatGPT
        run: node motor.mjs revisar-arte arte/chatgpt
      - name: Metadatos de construcción
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-city-construccion
          path: dist/construccion.json
          if-no-files-found: ignore
          retention-days: 7

  navegador:
    name: Chromium móvil y público simulado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: nucleo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright en el runner
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Construir HTML offline
        run: node motor.mjs construir
      - name: QA en Chromium
        run: node motor.mjs prueba --navegador
      - name: 4.5 · sin conexión (sw.js)
        run: node pruebas/sin-conexion.mjs
      - name: 4.5 · Turno Cero, la historia entera hasta un final
        run: node pruebas/getaway-historia.mjs
      - name: 4.6 · Los modos de Turno Cero (Carreras, Extremo, Mandados, EnCicla y el Metro) y el mapa
        run: node pruebas/modos.mjs
      - name: 4.7 · Actividades en el mundo abierto (marcas reales, ▶ desde la marca, trucos y tren)
        run: node pruebas/actividades.mjs
      - name: 4.7 · Pruebas humanas (solo entradas, sin teletransportar)
        run: node pruebas/humano.mjs
      - name: 4.8 · ⚙️ Flexibilidad (panel, se aplica, se guarda, vuelve a fábrica)
        run: node pruebas/flexibilidad.mjs
      - name: 4.8 · Pantalla en mitades, un solo mapa con 🚀 Ir y 🆘 Rescate
        run: node pruebas/rescate-mapa.mjs
      - name: 4.9 · 🖼️ 3D realista (three.js incrustado)
        run: node pruebas/tres.mjs
      - name: 5.0 · 🛞 Manejo real del carro (MC.Dinamica, números conocidos)
        run: node pruebas/dinamica.mjs
      - name: 5.1 · 🗯️ Vista Historieta (Gemini G5-01; contorno en la GPU)
        run: node pruebas/historieta.mjs
      - name: 5.1 · 🏔️ Paralaje por biomas en 🏁 Arcade (Gemini V4)
        run: node pruebas/paralaje-biomas.mjs
      - name: 5.4 · 🏎️ Carreras retro pseudo‑3D (MC.Pista) y su cápsula en Turno Cero
        run: node pruebas/pista-retro.mjs
      - name: 5.4.1 · 🧰 Cápsulas de Turno Cero (garaje sin cargar el núcleo, paso con el mismo estado y 📏 en las carreras retro)
        run: node pruebas/capsulas.mjs
      - name: 5.4.2 · 🔇 Guardián del sonido (Turno Cero calla al salir de la app)
        run: node pruebas/sonido-guardian.mjs
      - name: 5.1 · 💍 Anillos de recoger y entregar, y vuelo (Gemini G5-02)
        run: node pruebas/anillos.mjs
      - name: 5.2 · 🗣️ Ciudad viva (eventos, reacciones, escenas, frases y despacho)
        run: node pruebas/ciudad-viva.mjs
      - name: 5.2 · 🚦 Retos desde cualquier semáforo (G5-06)
        run: node pruebas/retos-semaforo.mjs
      - name: 5.2 · 📏 Medir el rendimiento (?medir, G5-12)
        run: node pruebas/medir.mjs
      - name: 5.3 · 🏛️ Sitios icónicos de Medellín en 3D (fichas G5-07 de Gemini; C5-02 primera versión)
        run: |
          node pruebas/sitios-medellin.mjs
          node pruebas/sitios-3d.mjs
      - name: 5.3 · 🚗 Vuelcos (C5-01 de ChatGPT) y 🔌 puentear tras un robo (G5-04 de Gemini)
        run: |
          node pruebas/vuelcos.mjs
          node pruebas/puentear-robo.mjs
      - name: 5.3 · 🔧 Minijuegos, 🍃 guía sin flecha en cine y 🧪 química del mundo (Gemini G5-04, G5-05 y G5-08)
        run: |
          node pruebas/minijuegos.mjs
          node pruebas/guia-cine.mjs
          node pruebas/quimica-mundo.mjs
      - name: "5.3 · R6-b (ChatGPT): datos compactos y Worker con respaldo (apagado por defecto; ?r6b)"
        run: |
          node pruebas/r6b-datos.mjs
          node pruebas/r6b-browser.mjs
      - name: 4.9.1 · R1 · Fachadas de Medellín (ChatGPT) en el 3D realista
        run: node pruebas/r1-fachadas.mjs
      - name: C-M34 · tres mundos offline con rasters de 1 km
        run: node pruebas/paquete-capas-browser.mjs
      - name: C-M34 · deduplicación y viaje real entre ciudades (Chromium offline)
        run: node pruebas/planeta-cache-browser.mjs
      - name: TURNO CERO · vertical slice offline en 4 tamaños
        run: node pruebas/getaway-prototipo.mjs
      - name: TURNO CERO 3D · WebGL2, cuatro formatos y misión completa
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          xvfb-run -a node pruebas/getaway-3d.mjs
      - name: C-M25 · Portada móvil y escritorio (anti plantilla genérica)
        run: node pruebas/portada.mjs
      - name: G-H1 · 14 capturas de revisión
        run: node motor.mjs capturas
      - name: Público simulado (ventana completa)
        run: node motor.mjs publico --seg 45
      - name: Guardar métricas de QA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-city-publico
          path: |
            dist/publico.md
            dist/publico.json
            dist/capturas/
            dist/getaway-3d/
            dist/construccion.json
          if-no-files-found: ignore
          retention-days: 7
