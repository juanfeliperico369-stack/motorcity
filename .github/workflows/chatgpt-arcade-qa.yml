name: ChatGPT · diagnóstico arcade sin teletransporte

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/chatgpt-arcade-qa.yml"
      - "pruebas/chatgpt-*"
      - "docs/PLAN-EVOLUCION-CHATGPT.md"
      - "js/50-run.js"
      - "js/47-seguir.js"
      - "juegos/getaway/60-modos.js"
      - "juegos/getaway/56-abierto.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Contratos + control real (sin mutar coordenadas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis de los diagnósticos
        run: |
          node --check pruebas/chatgpt-auditoria-contratos.mjs
          node --check pruebas/chatgpt-input-real.mjs
      - name: Auditoría estática (diagnóstica, no aprueba jugabilidad)
        run: |
          mkdir -p dist
          node pruebas/chatgpt-auditoria-contratos.mjs --json > dist/chatgpt-contratos.json
          node pruebas/chatgpt-auditoria-contratos.mjs
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Compilar juego offline
        run: node motor.mjs construir
      - name: Teclado, acelerador fijo y tren sin teletransportes (diagnóstico)
        run: node pruebas/chatgpt-input-real.mjs > dist/chatgpt-input-real.json
      - name: Imprimir salida del control real
        if: always()
        run: |
          if test -f dist/chatgpt-input-real.json; then cat dist/chatgpt-input-real.json; fi
      - name: Conservar evidencias JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-arcade-47-diagnosticos
          path: |
            dist/chatgpt-contratos.json
            dist/chatgpt-input-real.json
          if-no-files-found: ignore
          retention-days: 14
