<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Run City · Orbe</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e2532;color:#fff;font:600 14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;inset:12px 12px auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}.estado,.botones,.mando button{background:#102b3bea;border:1px solid #ffffff44;border-radius:12px;padding:10px 12px}.botones{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;padding:4px}button{font:inherit;color:#fff;background:#21516a;border:1px solid #a4c6d3;border-radius:9px;min-height:48px;min-width:48px;cursor:pointer;touch-action:none}button:active,button[aria-pressed=true]{background:#d8b05b;color:#14252e}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.mando{position:fixed;left:12px;bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,58px);gap:6px;touch-action:none}.mando button{height:58px;padding:4px;font-size:23px}.freno{position:fixed;right:12px;bottom:max(16px,env(safe-area-inset-bottom));height:58px;padding:0 18px}.aviso{position:fixed;top:36%;left:50%;transform:translateX(-50%);width:max-content;max-width:85vw;padding:12px;border-radius:12px;background:#102b3bee;text-align:center;pointer-events:none}.aviso[hidden]{display:none}.estado small{display:block;font-weight:500;color:#cee4ec}.botones button{padding:0 10px}@media(max-width:600px){.hud{justify-content:flex-start}.estado{flex:1}.botones{margin-left:auto}}
#panelCarrera{position:fixed;top:145px;left:12px;right:12px;max-width:460px;background:#102b3bea;border:1px solid #ffffff44;padding:10px;border-radius:12px}#panelCarrera[hidden],#carrera[hidden]{display:none}#ramas{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#ramas button{padding:0 10px}#mensajeCarrera{display:block;color:#cee4ec;font-size:12px}button:disabled{opacity:.55}
#garaje{position:fixed;top:135px;right:12px;max-width:min(360px,calc(100vw - 24px));max-height:45dvh;overflow:auto;background:#102b3bf5;padding:10px;border-radius:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;z-index:3}#garaje[hidden],#impulso[hidden]{display:none}#garaje button{padding:5px;min-width:0}#impulso{position:fixed;right:12px;bottom:90px;padding:0 14px}
</style></head><body>
<canvas id="cv" aria-label="Mundo tridimensional de Orbe"></canvas><div class="hud"><div class="estado"><span id="barrio">Orbe</span><small id="vel">Cargando mundo…</small></div><div class="botones"><button id="modo" aria-label="Cambiar vehículo">Bicicleta</button><button id="vehiculos" aria-label="Abrir garaje">Garaje</button><button id="carrera" hidden>Seguir ciclorruta</button><button id="pausa" aria-pressed="false">Pausa</button></div></div>
<div id="garaje" hidden aria-label="Garaje de vehículos"></div><div id="panelCarrera" hidden><span id="distancia"></span><small id="mensajeCarrera"></small><div id="ramas"></div></div><div id="aviso" class="aviso" role="status">Cargando Orbe…</div>
<div class="mando" aria-label="Controles de movimiento"><span></span><button id="avanzar" aria-label="Avanzar">▲</button><span></span><button id="izquierda" aria-label="Girar a la izquierda">◀</button><button id="derecha" aria-label="Girar a la derecha">▶</button></div><button id="impulso" hidden>Impulso</button><button id="freno" class="freno">Frenar</button>
<script type="module" src="./src/orbe.js"></script></body></html>
