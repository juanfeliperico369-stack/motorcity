<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Run City · Orbe</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#0e2532;color:#fff;font:600 14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.hud{position:fixed;inset:12px 12px auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}.estado,.botones,.mando button{background:#102b3bea;border:1px solid #ffffff44;border-radius:12px;padding:10px 12px}.botones{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto;padding:4px}button{font:inherit;color:#fff;background:#21516a;border:1px solid #a4c6d3;border-radius:9px;min-height:48px;min-width:48px;cursor:pointer;touch-action:none}button:active,button[aria-pressed=true]{background:#d8b05b;color:#14252e}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.mando{position:fixed;left:12px;bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,58px);gap:6px;touch-action:none}.mando button{height:58px;padding:4px;font-size:23px}.freno{position:fixed;right:12px;bottom:max(16px,env(safe-area-inset-bottom));height:58px;padding:0 18px}.aviso{position:fixed;top:36%;left:50%;transform:translateX(-50%);width:max-content;max-width:85vw;padding:12px;border-radius:12px;background:#102b3bee;text-align:center;pointer-events:none}.aviso[hidden]{display:none}.estado small{display:block;font-weight:500;color:#cee4ec}.botones button{padding:0 10px}@media(max-width:600px){.hud{justify-content:flex-start}.estado{flex:1}.botones{margin-left:auto}}
#panelCarrera{position:fixed;top:var(--panel-top,160px);left:12px;right:12px;max-width:460px;background:#102b3bea;border:1px solid #ffffff44;padding:10px;border-radius:12px}#panelCarrera[hidden],#carrera[hidden]{display:none}#ramas{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#ramas button{padding:0 10px}#mensajeCarrera{display:block;color:#cee4ec;font-size:12px}button:disabled{opacity:.55}
#garaje{position:fixed;top:var(--panel-top,160px);right:12px;max-width:min(360px,calc(100vw - 24px));max-height:45dvh;overflow:auto;background:#102b3bf5;padding:10px;border-radius:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;z-index:3}#garaje[hidden],#impulso[hidden]{display:none}#garaje button{padding:5px;min-width:0}#impulso{position:fixed;right:12px;bottom:90px;padding:0 14px}
#opciones{position:fixed;top:var(--panel-top,160px);right:12px;background:#102b3bf5;border-radius:12px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 24px);z-index:4}#opciones[hidden]{display:none}#opciones button{padding:0 8px}
/* HUD compacto, paneles desplazables y controles alternativos. */
.hud{gap:4px;inset:8px 8px auto}.estado{padding:6px 10px}.botones{gap:4px;padding:2px;flex-wrap:nowrap;max-width:100%;justify-content:flex-end}.botones button{padding:0 6px;font-size:12px;min-width:48px}#modo{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#carrera{max-width:100px;white-space:normal;line-height:1.1}#panelCarrera{top:var(--panel-top,110px);padding:6px 10px;max-width:calc(100vw - 24px)}#ramas:empty{display:none}#garaje{display:block;width:min(300px,calc(100vw - 24px));max-height:none;padding:6px;overflow:hidden}#garaje[hidden]{display:none}.garaje-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px}.garaje-head small{display:block;font-size:11px;color:#cee4ec}#listaGaraje{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:min(29dvh,260px);overflow:auto;scrollbar-width:thin;scrollbar-color:#cbdde5 #102b3b;padding:4px;touch-action:pan-y}#listaGaraje button{touch-action:pan-y}button:disabled{opacity:1;background:#344b57;color:#e5eef1;border-color:#879aa4;cursor:not-allowed}#velo{position:fixed;inset:0;background:#06142077;pointer-events:none;z-index:-1}body{isolation:isolate}canvas{position:relative;z-index:-2}#joystick{position:fixed;left:16px;bottom:max(16px,env(safe-area-inset-bottom));width:126px;height:126px;border:2px solid #b3d2de;border-radius:50%;background:#102b3b9c;touch-action:none;display:grid;place-items:center}#joy-knob{width:48px;height:48px;border-radius:50%;border:2px solid #d5e9ef;background:#39748c;pointer-events:none}#pad[hidden],#joystick[hidden],#velo[hidden]{display:none}#pad #avanzar{grid-column:2;grid-row:1}#pad #izquierda{grid-column:1;grid-row:2}#pad #derecha{grid-column:3;grid-row:2}@media(max-width:600px){.estado{flex:1 0 100%}.botones{margin-left:0;justify-content:space-between;width:100%}}
</style></head><body>
<canvas id="cv" aria-label="Mundo tridimensional de Orbe"></canvas><div class="hud"><div class="estado"><span id="barrio">Orbe</span><small id="vel">Cargando mundo…</small></div><div class="botones"><button id="modo" aria-label="Cambiar vehículo">Bicicleta</button><button id="vehiculos" aria-label="Abrir garaje">Garaje</button><button id="carrera" hidden>Seguir ciclorruta</button><button id="ajustes" aria-label="Abrir opciones">Opciones</button><button id="pausa" aria-pressed="false">Pausa</button></div></div>
<div id="opciones" hidden><button id="guardar">Guardar</button><button id="sonido" aria-pressed="false">Sonido: apagado</button><button id="zoom">Zoom</button><button id="tipoControl">Control: palanca</button></div><div id="garaje" hidden aria-label="Garaje de vehículos"><div class="garaje-head"><span>Garaje · 18 opciones<small>Desliza para ver más</small></span><button id="cerrarGaraje" aria-label="Cerrar garaje">✕</button></div><div id="listaGaraje"></div></div><div id="panelCarrera" hidden><span id="distancia"></span><small id="mensajeCarrera"></small><div id="ramas"></div></div><div id="aviso" class="aviso" role="status">Cargando Orbe…</div>
<div id="velo" hidden></div><div id="joystick" aria-label="Palanca virtual de movimiento" role="group"><span id="joy-knob"></span></div><div id="pad" class="mando" hidden aria-label="Controles de movimiento"><button id="avanzar" aria-label="Avanzar">▲</button><button id="izquierda" aria-label="Girar a la izquierda">◀</button><button id="derecha" aria-label="Girar a la derecha">▶</button></div><button id="impulso" hidden>Impulso</button><button id="freno" class="freno">Frenar</button>
